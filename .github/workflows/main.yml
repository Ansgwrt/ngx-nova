name: Build & Release (amd64 + arm64)

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  BINARY: nginx-mgr
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ngx-nova

jobs:
  # 1) 单测 + 静态检查（含内嵌漏洞库自检）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -v 2>&1 | tail -40

      - name: 打印当前漏洞库基线
        run: |
          python3 -c "import json; d=json.load(open('internal/service/advisories.json', encoding='utf-8')); print('advisories:', d['count'], '| recommended:', d['recommended'], '| generated_at:', d['generated_at'])"

  # 2) 交叉编译 linux/amd64 与 linux/arm64
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build (${{ matrix.goarch }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -buildid=" -o "dist/${BINARY}-linux-${{ matrix.goarch }}" .
          go build -trimpath -ldflags "-s -w -buildid=" -o "dist/tokenctl-linux-${{ matrix.goarch }}" ./cmd/tokenctl

      - name: 校验产物架构
        run: |
          file "dist/${BINARY}-linux-${{ matrix.goarch }}"
          file "dist/tokenctl-linux-${{ matrix.goarch }}"
          # 确认是目标架构的静态 ELF，不实际启动服务（启动会占用端口阻塞 CI）
          readelf -h "dist/${BINARY}-linux-${{ matrix.goarch }}" | grep -E "Class|Machine"

      - name: 打包
        run: |
          cd dist
          tar -czf "${BINARY}-linux-${{ matrix.goarch }}.tar.gz" \
            "${BINARY}-linux-${{ matrix.goarch }}" "tokenctl-linux-${{ matrix.goarch }}"
          sha256sum "${BINARY}-linux-${{ matrix.goarch }}.tar.gz" > "${BINARY}-linux-${{ matrix.goarch }}.tar.gz.sha256"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ngx-nova-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # 3) 打 tag 时创建 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # 4) 多架构镜像推送到 Docker Hub
  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: 检查 Docker Hub 凭据
        id: creds
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过镜像推送"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.creds.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        if: steps.creds.outputs.ready == 'true'
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.ready == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
