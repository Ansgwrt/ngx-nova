# ngx-nova 容器内 nginx 主配置
# 与 internal/service/nginx_build.go 生成的裸机基线保持一致，便于同一套站点配置迁移。

user  www-data www-data;
worker_processes  auto;
pid        /run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 隐藏版本号，避免按版本号定向利用
    server_tokens off;

    # TLS 会话缓存：同名共享内存区只能声明一次，尺寸必须与所有配置一致；
    # 站点模板已不再注入 ssl_session_cache，统一在这里定义。
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" "$host"';

    access_log  /var/log/nginx/access.log  main buffer=64k flush=10s;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_max_body_size 100m;

    # 缓解慢速攻击
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    large_client_header_buffers 4 16k;

    gzip  on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # 站点模板引用 my_proxy_cache，需在此定义
    proxy_cache_path /var/cache/nginx/proxy_cache levels=1:2
                     keys_zone=my_proxy_cache:100m
                     max_size=10g inactive=60m use_temp_path=off;

    include conf.d/*.conf;
    include sites-enabled/*;
}
